name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Genera la parte Android (solo i file mancanti)
        run: flutter create --platforms=android --org it.scoutvolley --project-name scout_pallavolo .

      - name: Nome dell'app
        run: sed -i 's/android:label="scout_pallavolo"/android:label="Scout Volley"/' android/app/src/main/AndroidManifest.xml

      - name: Chiave di firma fissa (per aggiornare senza disinstallare)
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Uso la chiave fissa"
          else
            echo "::warning::Secret DEBUG_KEYSTORE_B64 mancante: ogni build avrà una firma diversa"
          fi

      - run: flutter pub get

      - name: Analisi del codice
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Rinomina APK
        run: cp build/app/outputs/flutter-apk/app-release.apk scout-volley-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: scout-volley-apk
          path: scout-volley-${{ github.run_number }}.apk

      - name: Pubblica come release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          prerelease: true
          files: scout-volley-${{ github.run_number }}.apk
