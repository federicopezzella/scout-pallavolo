name: Build APK, IPA e webapp

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Genera la parte Android (solo i file mancanti)
        run: |
          flutter create --platforms=android --org it.scoutvolley --project-name scout_pallavolo .
          rm -f test/widget_test.dart

      - name: Nome dell'app
        run: sed -i 's/android:label="scout_pallavolo"/android:label="Scout Volley"/' android/app/src/main/AndroidManifest.xml

      - name: Chiave di firma fissa (per aggiornare senza disinstallare)
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Uso la chiave fissa"
          else
            echo "::warning::Secret DEBUG_KEYSTORE_B64 mancante: ogni build avrà una firma diversa"
          fi

      - run: flutter pub get

      - name: Analisi del codice
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Report PDF di esempio (branch report-preview)
        run: |
          mkdir -p /tmp/prev && cp build/report_sample.pdf /tmp/prev/
          cd /tmp/prev
          git init -q -b report-preview
          git add .
          git -c user.name=ci -c user.email=ci@localhost commit -qm "PDF di esempio build ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" report-preview

      - name: Build APK
        run: |
          flutter build apk --release --dart-define=BUILD=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk scout-volley-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: scout-volley-${{ github.run_number }}.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Genera la parte iOS (solo i file mancanti)
        run: |
          flutter create --platforms=ios --org it.scoutvolley --project-name scout_pallavolo .
          rm -f test/widget_test.dart

      - name: Nome dell'app
        run: /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Scout Volley" ios/Runner/Info.plist

      - run: flutter pub get

      - name: Build iOS (senza firma)
        run: flutter build ios --release --no-codesign --dart-define=BUILD=${{ github.run_number }}

      - name: Crea IPA
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr scout-volley-${{ github.run_number }}.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: scout-volley-${{ github.run_number }}.ipa

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Genera la parte web (solo i file mancanti)
        run: |
          flutter create --platforms=web --org it.scoutvolley --project-name scout_pallavolo .
          rm -f test/widget_test.dart
          python3 pwa/patch_web.py pre

      - run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href /scout-pallavolo/ --no-web-resources-cdn --dart-define=BUILD=${{ github.run_number }}

      - name: Service worker per l'uso offline
        run: python3 pwa/patch_web.py post ${{ github.run_number }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  pages:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    needs: [android, ios]
    if: always() && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: out

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ipa
          path: out

      - name: Pubblica come release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          prerelease: true
          files: out/*
